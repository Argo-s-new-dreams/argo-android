# Compilazione e test di Argo per Android a ogni modifica dell'app: un errore si vede qui,
# non sul Mac di notte durante la pubblicazione ai tester. Nessuna firma, nessun invio.
name: Compila

on:
  push:
    branches: [main]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/compila.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: SDK Android (piattaforma 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila (debug) e test
        run: ./gradlew --no-daemon compileDebugKotlin testDebugUnitTest
